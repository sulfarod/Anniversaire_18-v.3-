    <style>
        body {

            /* Cette liste cible les polices système d'Apple en priorité */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    
            /* Pour un look encore plus "Apple", on lisse les caractères */
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
    
            /* On augmente un peu l'espacement entre les lignes pour la lisibilité */
            line-height: 1.6;
    
            /* On s'assure que le texte n'est pas collé aux bords */
            padding: 40px;

            /* On indique le nom de ton image ici */
            background-image: url('Fond Divers.jpg');
            
            /* Pour que l'image ne se répète pas */
            background-repeat: no-repeat;
            
            /* Pour que l'image couvre tout l'écran, peu importe la taille */
            background-size: cover;
            
            /* Pour que l'image reste fixe quand on scroll */
            background-attachment: fixed;
            
            /* Pour centrer l'image */
            background-position: center;

            /* Petit bonus : on change la couleur du texte par défaut en blanc 
               pour qu'il soit lisible sur une image sombre */
            color: rgb(0, 0, 0);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;

            h1 {
            font-weight: 600; /* Un titre un peu épais mais pas trop */
            letter-spacing: -0.02em; /* Les titres Apple sont souvent un peu resserrés */
            font-size: 2.5rem;
            }

            p {
             font-weight: 400; /* Texte normal léger */
             color: #c5c5c5; /* Un blanc légèrement cassé, plus doux pour les yeux */
            }

             button {
             font-family: inherit; /* Pour que le bouton utilise aussi la police Apple */
             font-weight: 500;
            }


            /* Le conteneur qui contient l'image et les infos */
.cadeau-card {
    background-color: rgba(255, 255, 255, 0.1); /* Fond légèrement blanc transparent */
    border-radius: 12px;
    padding: 15px;
    margin-bottom: 20px;
    max-width: 500px; /* Pour que la carte ne soit pas trop large */
    max-height: 500px;
    transition: transform 0.2s; /* Petit effet au survol */
}

.cadeau-card:hover {
    transform: scale(1.02); /* La carte grossit un peu quand on passe la souris */
}

.cadeau-image {
    width: 100%;
    height: 400px;
    object-fit: cover;
    display: 8px;
}

/* La ligne qui contient le nom et le prix */
.cadeau-infos {
    display: flex;
    justify-content: space-between; /* Pousse le nom à gauche et le prix à droite */
    align-items: center;
    margin-top: 10px;
}

.nom-cadeau {
    font-weight: 600;
    font-size: 1.1rem;
}

.prix-cadeau {
    font-weight: 800;
    font-size: 1rem;
    color: #000000; /* Un orange qui attire l'œil sur le prix */
}

        }

        /* --- CONFIGURATION POUR MOBILE (Écrans de moins de 768px) --- */
@media (max-width: 768px) {
    body {
        padding: 15px; /* On réduit les marges sur le côté pour gagner de la place */
        font-size: 18px; /* On augmente la taille de base du texte */
    }

    h1 {
        font-size: 1.8rem; /* On réduit un peu la taille des gros titres pour qu'ils ne sortent pas de l'écran */
    }

    /* On force les cartes de cadeaux à prendre presque toute la largeur sur mobile */
    .cadeau-card {
        max-width: 100%; 
        margin: 10px 0;
    }

    /* Si tu as des boutons côte à côte, on les met l'un sous l'autre pour qu'ils soient plus faciles à cliquer */
    #themes-container {
        flex-direction: column;
    }

    button {
        width: 100%; /* Les boutons prennent toute la largeur pour être cliquables au pouce */
        padding: 20px;
        font-size: 1.1rem;
    }
}

    
    main {
    display: flex;
    flex-wrap: wrap; /* Permet d'aller à la ligne s'il n'y a plus de place */
    gap: 20px;       /* Espace entre les cartes */
    justify-content: center;
}
